name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure CMake
      run: |
        cd test
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
    
    - name: Build tests
      run: |
        cd test
        cmake --build build
    
    - name: Run tests
      run: |
        cd test/build
        ctest --output-on-failure

  web-ui-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: main/html/package-lock.json

    - name: Run web UI unit tests
      run: node --test main/html/test/*.test.js

    - name: Install Playwright test dependencies
      working-directory: main/html
      run: npm ci

    - name: Install Playwright browsers
      working-directory: main/html
      run: npx playwright install --with-deps chromium

    - name: Run Playwright browser tests
      working-directory: main/html
      run: npx playwright test
