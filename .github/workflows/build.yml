name: ESP-IDF Build

on:
  push:
    branches: [main]
    paths:
      - 'main/**'
      - 'managed_components/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'sdkconfig'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - 'partitions_stageA.csv'
      - 'partitions_stageB.csv'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'main/**'
      - 'managed_components/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'sdkconfig'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - 'partitions_stageA.csv'
      - 'partitions_stageB.csv'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: ESP-IDF Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32
          path: '.'

      # TEMPORARY: upload build artifacts for manual OTA testing of the
      # partition migration experiment. Remove before merging/closing
      # experiment/partition-migration-test.
      - name: Upload firmware artifacts (temp, migration testing)
        if: github.head_ref == 'experiment/partition-migration-test' || github.ref == 'refs/heads/experiment/partition-migration-test'
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-firmware
          path: |
            build/thermux.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          retention-days: 7
