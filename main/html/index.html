    <title>Thermux</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header-spacer { width: 44px; }
        h1 { 
            text-align: center; 
            font-size: 2em;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .logo-icon {
            width: 2.4em;
            height: auto;
            flex-shrink: 0;
        }
        .settings-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.4em;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.2); }
        .version { 
            text-align: center; 
            color: #888; 
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .status-item {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        .status-online { color: #4ade80; }
        .status-offline { color: #f87171; }
        .status-connecting {
            color: #fbbf24;
            animation: pulse-text 1.4s ease-in-out infinite;
        }
        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .sensors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .sensor-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.3s, background 0.3s;
            position: relative;
        }
        .sensor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .sensor-card.changed {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            animation: pulse 1s ease-in-out;
        }
        /* Empty-state message (no sensors found / no search matches): span
           the full grid width and center the text, instead of sitting
           left-aligned in the grid's first column like a real sensor card. */
        .sensor-card.empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #ccc;
        }
        .sensor-card.changed-major {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
            animation: pulse 0.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 20px 5px rgba(245, 158, 11, 0.6); }
        }
        .change-indicator {
            font-size: 0.9em;
            margin-top: 5px;
        }
        .change-indicator.warming { color: #ef4444; }
        .change-indicator.cooling { color: #3b82f6; }
        .filter-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.95em;
        }
        .search-input:focus {
            outline: none;
            border-color: #60a5fa;
        }
        .search-input::placeholder { color: #888; }
        .sort-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .sort-controls label {
            color: #888;
            font-size: 0.9em;
        }
        .sort-controls select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.9em;
        }
        .sort-controls select option {
            background: #1a1a2e;
            color: #fff;
        }
        .sensor-temp {
            font-size: 3em;
            font-weight: 300;
            color: #60a5fa;
            margin: 10px 0;
        }
        .sensor-name {
            font-size: 1.2em;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 28px;
        }
        .clone-badge, .genuine-badge {
            position: absolute;
            top: 16px;
            right: 18px;
            font-size: 1.1em;
            cursor: help;
            opacity: 0.9;
        }
        .genuine-badge {
            color: #22c55e;
        }
        .edit-name-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.85em;
            padding: 2px 4px;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.2s, color 0.2s;
        }
        .edit-name-btn:hover { opacity: 1; color: #60a5fa; }
        .sensor-address {
            font-size: 0.8em;
            color: #888;
            font-family: monospace;
        }
        .sensor-name-input {
            flex: 1;
            min-width: 0;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1em;
        }
        .sensor-name-input:focus {
            outline: none;
            border-color: #60a5fa;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .actions {
            text-align: center;
            margin-top: 30px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #22c55e;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .toast.error { background: #ef4444; }
        .loading { opacity: 0.5; }
        @media (max-width: 600px) {
            .sensor-temp { font-size: 2.5em; }
            h1 { font-size: 1.5em; }
        }
    </style>
</head>

            <button class="settings-btn" onclick="location.href='/config'" title="Settings">⚙️</button>
        </div>
        <div class="version" id="version">Version loading...</div>
        
        <div class="status-bar">
            <div class="status-item">
                <span id="sensor-count">0</span> Sensors
            </div>
            <div class="status-item">
                MQTT: <span id="mqtt-status" class="status-offline">Offline</span>
            </div>
            <div class="status-item" title="Click to reset" style="cursor: pointer;" onclick="resetErrorStats()">
                Recent Bus Errors: <span id="bus-error-rate">-</span>
            </div>
            <div class="status-item">
                Last Good Read: <span id="bus-last-success">-</span>
            </div>
            <div class="status-item">
                Failed Cycles: <span id="bus-failed-cycles">-</span>
            </div>
            <div class="status-item">
                Uptime: <span id="uptime">-</span>
            </div>
            <div class="status-item">
                Last Update: <span id="last-update">-</span>
            </div>
            <button class="btn btn-secondary" onclick="rescanSensors()" style="margin-left: auto;">🔄 Rescan</button>
        </div>

        <div class="filter-controls">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Filter by name..." oninput="renderSensors()" autocomplete="off">
            <button class="btn btn-secondary" id="clear-filter-btn" onclick="clearFilter()" style="margin-top:0;display:none;">Clear</button>
        </div>

        <div class="sort-controls">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select" onchange="renderSensors()">
                <option value="name">Name</option>
                <option value="address">Address</option>
                <option value="temp">Temperature</option>
                <option value="change" selected>Recent Change</option>
                <option value="errors">Error Rate</option>
            </select>
            <label title="Highlight sensors that changed more than this">Threshold:</label>
            <select id="threshold-select" onchange="renderSensors()">
                <option value="0.5">0.5°C</option>
                <option value="1" selected>1°C</option>
                <option value="2">2°C</option>
                <option value="5">5°C</option>
            </select>
        </div>

        <div id="max-sensor-warning" style="display:none;background:rgba(245,158,11,0.2);border:1px solid #f59e0b;color:#fbbf24;padding:12px 20px;border-radius:10px;margin-bottom:20px;text-align:center;font-size:0.9em;"></div>

        <div class="sensors-grid" id="sensors-grid">
            <div class="sensor-card loading">Loading sensors...</div>
        </div>


    </div>

    <div class="toast" id="toast"></div>

    <script>
        let sensors = [];
        let previousTemps = {};  /* Track previous temps for change detection */
        let changeAmounts = {};  /* Track recent change amounts */
        let updateInterval;
        let isEditing = false;

        /* Pure decision function for the inline name-edit blur handler.
           Extracted so it can be unit tested without a DOM/browser. */
        function shouldSaveOnBlur(cancelled) {
            return cancelled !== '1';
        }
        /* istanbul ignore next -- exposed only for Node test harness, no-op in browser */
        if (typeof module !== 'undefined' && module.exports) {
            module.exports = { shouldSaveOnBlur };
        }

        /* Check for auth errors and redirect to login if session expired */
        function checkAuthError(response) {
            if (response.status === 401) {
                window.location.href = '/login?redirect=' + encodeURIComponent(window.location.pathname);
                return true;
            }
            return false;
        }

        function formatDuration(totalSeconds) {
            if (totalSeconds === null || totalSeconds === undefined) return 'No data';
            const seconds = Math.max(0, Math.floor(totalSeconds));
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const remainder = seconds % 60;
            if (days > 0) return `${days}d ${hours}h`;
            if (hours > 0) return `${hours}h ${minutes}m`;
            if (minutes > 0) return `${minutes}m ${remainder}s`;
            return `${remainder}s`;
        }

        async function fetchSensors() {
            if (isEditing) return;
            try {
                const response = await fetch('/api/sensors');
                if (checkAuthError(response)) return;
                const newSensors = await response.json();
                
                /* Calculate changes from previous readings */
                const threshold = parseFloat(document.getElementById('threshold-select').value);
                newSensors.forEach(sensor => {
                    if (previousTemps[sensor.address] !== undefined && sensor.valid) {
                        const change = sensor.temperature - previousTemps[sensor.address];
                        /* Keep track of significant changes (decay over time) */
                        const prevChange = changeAmounts[sensor.address] || 0;
                        if (Math.abs(change) >= threshold * 0.5) {
                            changeAmounts[sensor.address] = change;
                        } else {
                            /* Decay the change indicator gradually */
                            changeAmounts[sensor.address] = prevChange * 0.7;
                        }
                    }
                    if (sensor.valid) {
                        previousTemps[sensor.address] = sensor.temperature;
                    }
                });
                
                sensors = newSensors;
                renderSensors();
                document.getElementById('sensor-count').textContent = sensors.length;
                document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
            } catch (err) {
                showToast('Failed to fetch sensors', true);
            }
        }

        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                if (checkAuthError(response)) return;
                const status = await response.json();
                document.getElementById('version').textContent = 'Version ' + status.version;
                const mqttEl = document.getElementById('mqtt-status');
                if (status.mqtt_connected) {
                    mqttEl.textContent = 'Online';
                    mqttEl.className = 'status-online';
                    mqttEl.title = '';
                } else if (status.mqtt_connecting) {
                    mqttEl.textContent = 'Reconnecting…';
                    mqttEl.className = 'status-connecting';
                    mqttEl.title = status.mqtt_last_error || 'Attempting to connect';
                } else {
                    mqttEl.textContent = 'Offline';
                    mqttEl.className = 'status-offline';
                    mqttEl.title = status.mqtt_last_error || '';
                }
                document.getElementById('uptime').textContent = formatDuration(status.uptime_seconds);
                /* Update bus error stats */
                if (status.bus_stats) {
                    const s = status.bus_stats;
                    const el = document.getElementById('bus-error-rate');
                    if (s.total_reads === 0) {
                        el.textContent = 'No data';
                        el.className = '';
                    } else {
                        el.textContent = s.recent_error_rate.toFixed(2) + '%';
                        el.title = 'Lifetime: ' + s.error_rate.toFixed(2) + '% (' + s.failed_reads + '/' + s.total_reads + ')';
                        el.className = s.recent_error_rate > 0 ? 'status-offline' : 'status-online';
                    }
                    const lastSuccess = document.getElementById('bus-last-success');
                    lastSuccess.textContent = s.seconds_since_last_success === null
                        ? 'No successful read'
                        : formatDuration(s.seconds_since_last_success) + ' ago';
                    lastSuccess.className = s.consecutive_failed_cycles > 0 ? 'status-offline' : 'status-online';

                    const failedCycles = document.getElementById('bus-failed-cycles');
                    failedCycles.textContent = s.consecutive_failed_cycles;
                    failedCycles.className = s.consecutive_failed_cycles > 0 ? 'status-offline' : 'status-online';
                }
                /* Warn if at max sensor limit */
                const warn = document.getElementById('max-sensor-warning');
                if (status.sensor_count >= status.max_sensors) {
                    warn.textContent = '⚠️ Maximum sensor limit reached (' + status.max_sensors + '). Additional sensors will be ignored. Increase MAX_SENSORS in menuconfig.';
                    warn.style.display = 'block';
                } else {
                    warn.style.display = 'none';
                }
            } catch (err) {
                console.error('Failed to fetch status');
            }
        }

        function renderSensors() {
            const grid = document.getElementById('sensors-grid');
            if (sensors.length === 0) {
                grid.innerHTML = '<div class="sensor-card empty-state">No sensors found. Click "Rescan Sensors" to detect connected sensors.</div>';
                return;
            }
            
            const sortBy = document.getElementById('sort-select').value;
            const threshold = parseFloat(document.getElementById('threshold-select').value);

            /* Apply local name filter (case-insensitive substring on displayed name) */
            const filterText = (document.getElementById('search-input').value || '').trim().toLowerCase();
            document.getElementById('clear-filter-btn').style.display = filterText ? 'inline-block' : 'none';

            /* Sort sensors based on selection */
            let sortedSensors = [...sensors];
            switch (sortBy) {
                case 'name':
                    sortedSensors.sort((a, b) => (a.friendly_name || a.address).localeCompare(b.friendly_name || b.address));
                    break;
                case 'address':
                    sortedSensors.sort((a, b) => a.address.localeCompare(b.address));
                    break;
                case 'temp':
                    sortedSensors.sort((a, b) => (b.temperature || 0) - (a.temperature || 0));
                    break;
                case 'change':
                    sortedSensors.sort((a, b) => Math.abs(changeAmounts[b.address] || 0) - Math.abs(changeAmounts[a.address] || 0));
                    break;
                case 'errors':
                    sortedSensors.sort((a, b) => {
                        const rateA = a.total_reads > 0 ? (a.failed_reads / a.total_reads) : 0;
                        const rateB = b.total_reads > 0 ? (b.failed_reads / b.total_reads) : 0;
                        return rateB - rateA;
                    });
                    break;
            }

            /* Filter after sorting so the matched cards keep the chosen order */
            if (filterText) {
                sortedSensors = sortedSensors.filter(s =>
                    (s.friendly_name || s.address).toLowerCase().includes(filterText));
            }

            if (sortedSensors.length === 0) {
                const safe = filterText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                grid.innerHTML = '<div class="sensor-card empty-state">No sensors match &quot;' + safe + '&quot;.</div>';
                return;
            }

            grid.innerHTML = sortedSensors.map(sensor => {
                const change = changeAmounts[sensor.address] || 0;
                const absChange = Math.abs(change);
                let cardClass = 'sensor-card';
                if (absChange >= threshold * 2) {
                    cardClass += ' changed-major';
                } else if (absChange >= threshold) {
                    cardClass += ' changed';
                }
                
                let changeHtml = '';
                if (absChange >= threshold * 0.5) {
                    const arrow = change > 0 ? '↑' : '↓';
                    const tempClass = change > 0 ? 'warming' : 'cooling';
                    changeHtml = `<div class="change-indicator ${tempClass}">${arrow} ${absChange.toFixed(1)}°C</div>`;
                }
                
                return `
                <div class="${cardClass}" data-address="${sensor.address}">
                    ${sensor.genuine === false ? '<span class="clone-badge" title="Possible clone/counterfeit" onclick="showToast(\'⚠️ Possible clone/counterfeit sensor\', true)">⚠️</span>' : (sensor.genuine === true ? '<span class="genuine-badge" title="Verified genuine DS18B20" onclick="showToast(\'🛡️ Verified genuine DS18B20\')">🛡️</span>' : '')}
                    <div class="sensor-name" id="name-display-${sensor.address}">
                        <span id="name-text-${sensor.address}">${sensor.friendly_name || sensor.address}</span>
                        <button class="edit-name-btn" title="Edit name" onclick="startEditName('${sensor.address}')">✏️</button>
                    </div>
                    <div class="sensor-name" id="name-edit-${sensor.address}" style="display:none;">
                        <input type="text" class="sensor-name-input"
                               id="name-input-${sensor.address}"
                               placeholder="Enter friendly name"
                               value="${sensor.friendly_name || ''}"
                               onfocus="isEditing = true"
                               onkeydown="if(event.key==='Enter') { this.blur(); } else if(event.key==='Escape') { this.dataset.cancelled = '1'; this.blur(); }"
                               onblur="if(!shouldSaveOnBlur(this.dataset.cancelled)) { cancelEditName('${sensor.address}'); } else { saveName('${sensor.address}', this.value); }">
                        <button class="edit-name-btn" title="Cancel" onmousedown="event.preventDefault(); document.getElementById('name-input-${sensor.address}').dataset.cancelled='1'; document.getElementById('name-input-${sensor.address}').blur();">✖️</button>
                    </div>
                    <div class="sensor-address">${sensor.address}</div>
                    <div class="sensor-temp">${sensor.valid ? sensor.temperature.toFixed(1) + '°C' : '--.-°C'}</div>
                    ${changeHtml}
                    <div class="sensor-error-rate" style="font-size:0.8em;color:${sensor.failed_reads > 0 ? '#f87171' : '#4ade80'};margin-top:5px;cursor:pointer;" title="Click to reset this sensor's error stats" onclick="resetSensorErrors('${sensor.address}')">Errors: ${sensor.total_reads > 0 ? (sensor.failed_reads / sensor.total_reads * 100).toFixed(2) + '% (' + sensor.failed_reads + '/' + sensor.total_reads + ')' : 'No data'}</div>
                </div>
            `}).join('');
        }

        function startEditName(address) {
            isEditing = true;
            document.getElementById('name-display-' + address).style.display = 'none';
            const editRow = document.getElementById('name-edit-' + address);
            editRow.style.display = 'flex';
            const input = document.getElementById('name-input-' + address);
            input.focus();
            input.select();
        }

        function cancelEditName(address) {
            isEditing = false;
            document.getElementById('name-edit-' + address).style.display = 'none';
            document.getElementById('name-display-' + address).style.display = 'flex';
        }

        async function saveName(address, name) {
            try {
                const response = await fetch('/api/sensors/' + address + '/name', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ friendly_name: name })
                });
                if (checkAuthError(response)) return;
                if (response.ok) {
                    isEditing = false;
                    showToast('Name saved successfully');
                    fetchSensors();
                } else {
                    showToast('Failed to save name', true);
                }
            } catch (err) {
                showToast('Error saving name', true);
            }
        }

        async function rescanSensors() {
            try {
                showToast('Scanning for sensors...');
                const response = await fetch('/api/sensors/rescan', { method: 'POST' });
                if (checkAuthError(response)) return;
                if (response.ok) {
                    showToast('Scan complete');
                    fetchSensors();
                } else {
                    showToast('Scan failed', true);
                }
            } catch (err) {
                showToast('Error during scan', true);
            }
        }

        async function resetErrorStats() {
            try {
                const response = await fetch('/api/sensors/error-stats/reset', { method: 'POST' });
                if (checkAuthError(response)) return;
                if (response.ok) {
                    showToast('All error stats reset');
                    fetchStatus();
                    fetchSensors();
                } else {
                    showToast('Failed to reset stats', true);
                }
            } catch (err) {
                showToast('Error resetting stats', true);
            }
        }

        async function resetSensorErrors(address) {
            try {
                const response = await fetch('/api/sensors/' + address + '/error-stats/reset', { method: 'POST' });
                if (checkAuthError(response)) return;
                if (response.ok) {
                    showToast('Sensor error stats reset');
                    fetchSensors();
                } else {
                    showToast('Failed to reset sensor stats', true);
                }
            } catch (err) {
                showToast('Error resetting sensor stats', true);
            }
        }

        function clearFilter() {
            const input = document.getElementById('search-input');
            input.value = '';
            renderSensors();
            input.focus();
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => toast.className = 'toast', 3000);
        }

        fetchStatus();
        fetchSensors();
        updateInterval = setInterval(() => { fetchSensors(); fetchStatus(); }, 5000);
    </script>
</body>
</html>
